<div class="swiper-slide">
  <a class="case__item anim-item" href="@@link">
    <div class="case__item-img">
      <img src="@@img" alt="">
    </div>
    <div class="case__item-content">
      <div class="case__item-title">
        @@title
      </div>
      <div class="case__item-feats">
        <div class="case__item-feat">
          <div class="case__item-count">
            @@feat-1
          </div>
          <div class="case__item-text">
            Объём доставленного груза
          </div>
        </div>
        <div class="case__item-feat">
          <div class="case__item-count">
            @@feat-2
          </div>
          <div class="case__item-text">
            Вес доставленного груза
          </div>
        </div>
        <div class="case__item-feat">
          <div class="case__item-count">
            @@feat-3
          </div>
          <div class="case__item-text">
            Срок доставки
          </div>
        </div>
      </div>
      <div class="btn--default">
        Подробнее
      </div>
    </div>
  </a>
</div>
