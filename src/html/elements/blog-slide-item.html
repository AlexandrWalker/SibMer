<div class="swiper-slide blog__slide">
  <a class="blog__item anim-item" href="@@link">
    <div class="blog__item-img">
      <img src="@@img" alt="">
    </div>
    <div class="blog__item-content">
      <div class="blog__item-title">
        @@title
      </div>
      <div class="blog__item-date">
        @@date
      </div>
      <div class="blog__item-text">
        <p>
          @@text
        </p>
      </div>
      <div class="blog__item-btn btn--default">
        Читать подробно
      </div>
    </div>
  </a>
</div>
