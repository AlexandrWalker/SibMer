<section class="opinions">
  <div class="container">
    <div class="opinions__inner">

      <div class="general__head">
        <div class="general__title" data-split="lines">
          <h2>
            @@title
          </h2>
        </div>
      </div>
      <div class="general__body">
        <div class="opinions__body">
          <div class="swiper articles__slider anim-items">
            <div class="swiper-wrapper">
              @@loop('./../elements/blog-slide-item.html', './data/blog-items.json')
            </div>
          </div>
        </div>
      </div>
      <div class="general__foot">
        <div class="general__btns">
          <div class="swiper-button-prev articles-button-prev">
            <i class="icon-arrow-left-long"></i>
          </div>
          <div class="swiper-button-next articles-button-next">
            <i class="icon-arrow-right-long"></i>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
