<!DOCTYPE html>
<html lang="ru" class="inner-page">
@@include('blocks/head.html', {"title": "Siberian Merchant Lines"})

<body>
  <div class="wrapper">
    <!-- Шапка -->
    @@include('./blocks/header.html')
    <!-- Меню -->
    @@include('./blocks/menu.html')
    <main class="main">

      <section class="template">
        <div class="container">
          <div class="template__inner">

            <div class="breadcrumbs">
              <div class="breadcrumbs__items">
                <a class="breadcrumbs__item" href="/SibMer">
                  <span>
                    Главная
                  </span>
                </a>
                <div class="breadcrumbs__item">
                  <span>
                    Блог
                  </span>
                </div>
              </div>
            </div>

            <div class="template__head">
              <div class="template__title" data-split="lines">
                <h1>
                  Блог
                </h1>
              </div>
            </div>

          </div>
        </div>
      </section>

      <section class="blog">
        <div class="container">
          <div class="blog__inner">

            <div class="general__control">
              <div class="general__tabs general__tabs--alt">
                <div class="general__tabs-items">
                  <div class="general__tabs-item tabs--active">
                    Новости компании
                  </div>
                  <div class="general__tabs-item">
                    Статьи
                  </div>
                  <div class="general__tabs-item">
                    Все
                  </div>
                </div>
              </div>
            </div>

            <div class="blog__content">
              <div class="blog__items anim-items">
                @@loop('./elements/blog-item.html', './data/blog-items.json')
              </div>
            </div>

          </div>
        </div>
      </section>

    </main>
    <!-- Подвал -->
    @@include('blocks/footer.html')
